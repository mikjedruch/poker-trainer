<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Same value as --color-bg (dark) in src/shared/theme.css; updated at runtime for the light theme. -->
    <meta name="theme-color" content="#15171b" />
    <meta name="description" content="Trener pokera: live 6-max NLHE $1/$2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Trener pokera</title>
    <script>
      // Apply stored display settings before the first paint (no dark flash for light-theme users).
      // Key and values must match src/shared/settings.ts.
      try {
        var s = JSON.parse(localStorage.getItem('poker-trainer/settings/v1') || '{}') || {};
        if (s.theme === 'light') document.documentElement.dataset.theme = 'light';
        if (s.deck === 'two') document.documentElement.dataset.deck = 'two';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
